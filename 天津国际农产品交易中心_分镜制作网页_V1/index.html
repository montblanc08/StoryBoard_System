<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>天津国际农产品交易中心｜分镜制作</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">津</div>
      <div>
        <h1>制作分镜</h1>
        <p>天津国际农产品交易中心 · 4分30秒</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="button primary" id="addShotButton" type="button">＋ 新建镜头</button>
      <button class="button" id="saveButton" type="button">保存</button>
      <button class="button" id="printButton" type="button">打印</button>
      <div class="menu-wrap">
        <button class="button" id="moreButton" type="button" aria-expanded="false">更多 ▾</button>
        <div class="menu" id="moreMenu" hidden>
          <button id="exportButton" type="button">导出 JSON</button>
          <label class="menu-file">导入 JSON<input id="importInput" type="file" accept="application/json" hidden></label>
          <button id="resetButton" class="danger-text" type="button">恢复初始数据</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="项目概览">
      <div class="summary-card accent"><span>总镜数</span><strong id="shotCount">80</strong><small>shots</small></div>
      <div class="summary-card"><span>总时长</span><strong id="totalSeconds">270.0</strong><small>秒</small></div>
      <div class="summary-card"><span>成片长度</span><strong id="totalMinutes">4:30</strong><small>min</small></div>
      <div class="chapter-progress" id="chapterProgress" aria-label="篇章时长分布"></div>
    </section>

    <section class="toolbar" aria-label="分镜工具栏">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索镜号、场景、内容或旁白" autocomplete="off">
      </label>
      <label class="select-label">篇章
        <select id="chapterFilter"><option value="">全部篇章</option></select>
      </label>
      <label class="select-label">密度
        <select id="densitySelect">
          <option value="comfortable">舒适</option>
          <option value="compact">紧凑</option>
        </select>
      </label>
      <button class="button ghost" id="clearFilterButton" type="button">清除筛选</button>
      <span class="save-state" id="saveState" role="status">已加载初始版本</span>
    </section>

    <section class="table-shell" aria-label="分镜制作表">
      <div class="table-scroll" id="tableScroll">
        <table class="storyboard-table">
          <thead>
            <tr>
              <th class="col-order">排序</th>
              <th class="col-id">编号</th>
              <th class="col-image">画面</th>
              <th class="col-reference">参考</th>
              <th class="col-small">景别</th>
              <th class="col-duration">时长（秒）</th>
              <th class="col-content">内容</th>
              <th class="col-notes">备注 / 旁白</th>
              <th class="col-location">场景</th>
              <th class="col-sound">声音</th>
              <th class="col-angle">摄影机角度</th>
              <th class="col-movement">运镜</th>
              <th class="col-equipment">摄影机设备</th>
              <th class="col-focal">镜头焦段</th>
              <th class="col-scene">场号 / 篇章</th>
              <th class="col-actions" aria-label="操作">＋</th>
            </tr>
          </thead>
          <tbody id="storyboardBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" hidden>没有符合当前筛选条件的镜头。</div>
      </div>
    </section>
  </main>

  <input id="imageInput" type="file" accept="image/*" hidden>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="分镜大图预览">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭预览">×</button>
    <img id="lightboxImage" alt="">
    <div id="lightboxCaption"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="shots-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
